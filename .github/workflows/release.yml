name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-and-notes:
    name: Compute Dynamic Version & Release Notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: ver
        run: |
          VERSION="0.0.${{ github.run_number }}"
          echo "Computed version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Generate Dynamic Release Notes
        id: notes
        run: |
          NOTES_FILE="$RUNNER_TEMP/release_notes.md"
          cat << 'EOF' > "$NOTES_FILE"
          ### Sark Docs Manager v0.0.${{ github.run_number }}
          **The Ultimate Documents Solution** - Creation, Viewing, Editing, Tools, and Document Management.

          #### Highlights & What's New:
          - **Multi-Document Creation**: Create brand new PDF documents, Word (.docx), Excel spreadsheets (.xlsx), and PowerPoint presentations (.pptx).
          - **PDF Text & Image Editing**: Formatted rich text editing with fonts, sizes, colors, and direct in-place image insertion, replacement, and resizing.
          - **Variants & Platforms**:
            - Windows: `windows/Sark-Docs-Manager_${{ steps.ver.outputs.version }}_x64-setup.exe` & `.msi`
            - Linux: `linux/` including Flatpak bundle, AppImage, `.deb`, and `.rpm`.
            - Android: `android/SarkDocsManager-v${{ steps.ver.outputs.version }}-arm64.apk` (ARM64 only).
          - **Seamless Updates & Persistent Release Keys**: Pre-configured automatic signing key persistence for clean updates without reinstall conflicts.
          - **Reduced App Size & Focused Localization**: Lightweight, fast, and optimized for English (stable).

          #### Recent Commits:
          EOF
          git log -n 10 --pretty=format:"- %s (%h)" >> "$NOTES_FILE" || true
          echo "" >> "$NOTES_FILE"
          echo "notes_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ steps.notes.outputs.notes_path }}

  windows-build:
    name: Windows Variant
    needs: version-and-notes
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update versions
        run: |
          $ver = "${{ needs.version-and-notes.outputs.version }}"
          (Get-Content src-tauri/tauri.conf.json) -replace '"version": ".*?"', "`"version`": `"$ver`"" | Set-Content src-tauri/tauri.conf.json
          (Get-Content package.json) -replace '"version": ".*?"', "`"version`": `"$ver`"" | Set-Content package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Generate app icons
        run: |
          npx tauri icon assets/brand/app-icon.svg --output src-tauri/icons

      - name: Build Windows Variant
        run: npx tauri build

      - name: Organize Windows artifacts
        shell: bash
        run: |
          mkdir -p dist-releases/windows
          cp -r src-tauri/target/release/bundle/nsis/*.exe dist-releases/windows/ 2>/dev/null || true
          cp -r src-tauri/target/release/bundle/msi/*.msi dist-releases/windows/ 2>/dev/null || true
          ls -la dist-releases/windows/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sark-docs-manager-windows
          path: dist-releases/windows/

  linux-build:
    name: Linux Variant (Flatpak, AppImage, Deb, Rpm)
    needs: version-and-notes
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update versions
        run: |
          VER="${{ needs.version-and-notes.outputs.version }}"
          jq --arg v "$VER" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          jq --arg v "$VER" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Install Linux dependencies & Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf flatpak flatpak-builder elfutils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Generate app icons
        run: |
          npx tauri icon assets/brand/app-icon.svg --output src-tauri/icons

      - name: Build Linux Targets (deb, appimage, rpm)
        run: npx tauri build --bundles appimage,deb,rpm

      - name: Package Flatpak Variant
        shell: bash
        run: |
          mkdir -p dist-releases/linux
          # Prepare Flatpak manifest and build flatpak bundle
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo || true
          # Create a standalone flatpak bundle container or export bundle
          node scripts/build-flatpak.mjs || true
          # Copy outputs
          cp -r src-tauri/target/release/bundle/appimage/*.AppImage dist-releases/linux/ 2>/dev/null || true
          cp -r src-tauri/target/release/bundle/deb/*.deb dist-releases/linux/ 2>/dev/null || true
          cp -r src-tauri/target/release/bundle/rpm/*.rpm dist-releases/linux/ 2>/dev/null || true
          cp -r dist-releases/*.flatpak dist-releases/linux/ 2>/dev/null || true
          ls -la dist-releases/linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sark-docs-manager-linux
          path: dist-releases/linux/

  android-build:
    name: Android Variant (ARM64 only)
    needs: version-and-notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update versions
        run: |
          VER="${{ needs.version-and-notes.outputs.version }}"
          jq --arg v "$VER" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          jq --arg v "$VER" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        env:
          NDK_VERSION: 28.2.13676358
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "GRADLE_OPTS=-Dorg.gradle.daemon=false" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust (arm64 only)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Cache or Generate Android Release Signing Key
        id: signing-key
        uses: actions/cache@v4
        with:
          path: ~/.android/sark-release.keystore
          key: sark-docs-manager-release-keystore-v1

      - name: Generate Android keystore if missing
        run: |
          mkdir -p ~/.android
          KEYSTORE=~/.android/sark-release.keystore
          if [ ! -f "$KEYSTORE" ]; then
            echo "Generating persistent release keystore for future releases..."
            keytool -genkey -v -keystore "$KEYSTORE" -alias sarkdocs -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "sarkdocsmanagerkey" -keypass "sarkdocsmanagerkey" \
              -dname "CN=Sark Docs Manager, OU=Sark, O=Sark, L=Default, S=Default, C=US"
          fi

      - name: Generate app icons
        run: |
          npx tauri icon assets/brand/app-icon.svg --output src-tauri/icons
          npx tauri icon assets/brand/app-icon-foreground.svg --output .tauri-icons-android

      - name: Initialize Android project
        run: npx tauri android init

      - name: Patch generated Android project
        run: |
          node scripts/patch-android-signing.mjs
          node scripts/patch-android-icons.mjs
          node scripts/install-android.mjs

      - name: Configure release signing
        run: |
          mkdir -p src-tauri/gen/android
          {
            echo "storeFile=$HOME/.android/sark-release.keystore"
            echo "storePassword=sarkdocsmanagerkey"
            echo "keyAlias=sarkdocs"
            echo "keyPassword=sarkdocsmanagerkey"
          } > src-tauri/gen/android/keystore.properties

      - name: Build Android ARM64 APK
        run: npx tauri android build --apk --target aarch64

      - name: Organize Android artifacts
        run: |
          mkdir -p dist-releases/android
          VER="${{ needs.version-and-notes.outputs.version }}"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1 || true)
          if [ -f "$APK" ]; then
            cp "$APK" "dist-releases/android/sark-docs-manager-v${VER}-android-arm64.apk"
          fi
          ls -la dist-releases/android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sark-docs-manager-android
          path: dist-releases/android/

  publish-github-release:
    name: Automatic GitHub Release
    needs: [version-and-notes, windows-build, linux-build, android-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare Separate Folders & Files for Release
        run: |
          mkdir -p final-release/windows
          mkdir -p final-release/linux
          mkdir -p final-release/android

          cp -r release-assets/sark-docs-manager-windows/* final-release/windows/ 2>/dev/null || true
          cp -r release-assets/sark-docs-manager-linux/* final-release/linux/ 2>/dev/null || true
          cp -r release-assets/sark-docs-manager-android/* final-release/android/ 2>/dev/null || true

          # Create a unified zip for each folder variant for convenient direct download
          cd final-release
          zip -r sark-docs-manager-windows.zip windows/
          zip -r sark-docs-manager-linux.zip linux/
          zip -r sark-docs-manager-android.zip android/
          cd ..

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes-dir

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-and-notes.outputs.version }}
          name: sark-docs-manager-for-v${{ needs.version-and-notes.outputs.version }}
          body_path: release-notes-dir/release_notes.md
          draft: false
          prerelease: false
          files: |
            final-release/sark-docs-manager-windows.zip
            final-release/sark-docs-manager-linux.zip
            final-release/sark-docs-manager-android.zip
            final-release/android/*.apk
            final-release/windows/*
            final-release/linux/*
