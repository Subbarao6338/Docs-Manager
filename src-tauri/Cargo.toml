[package]
name = "sark-docs-manager"
version = "0.0.1"
edition = "2021"
rust-version = "1.77.2"
description = "Sark Docs Manager: ultimate documents solution"
authors = ["Sark Docs Manager"]

[lib]
name = "sark_docs_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sark-docs-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Updates on Windows and macOS only: Android updates through its store,
# and its APK must carry no network permission.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
